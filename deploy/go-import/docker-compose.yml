# The vanity import path behind `go get go.londer.be/cardinal`.
#
# Lives at /home/deploy/services/golang on the VPS, following the same pattern
# as the other services there: on the external `web` network, no published
# ports, reached through Nginx Proxy Manager.
#
# The service is called `go` because that is the name the proxy host already
# forwards to — Docker Compose publishes the service name as a network alias, so
# `http://go:80` resolves to this container from anywhere on `web`. Renaming it
# here would mean editing the proxy host too.
#
#   docker compose up -d
#   curl -s "https://go.londer.be/cardinal?go-get=1" | grep go-import
#
# Nothing else is needed: the proxy host go.londer.be -> go:80 with Let's
# Encrypt is already in place.
services:
  go:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web

networks:
  web:
    external: true
