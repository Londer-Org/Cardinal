# Serve the go-import meta tag for every path under this host.
#
# Every path, not just /cardinal: the Go tool starts from the full package path
# and walks up, so a request arrives for /cardinal/cmd/cardinal before one
# arrives for /cardinal. Returning the same tag for all of them is correct — the
# tag names the prefix it claims, and Go checks that claim against what it
# asked for.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "public, max-age=300";
    }
}
