# Releases for Cardinal.
#
# Two binaries with opposite distribution needs. `cardinal` is an administrator's
# tool that talks to the database — a container image and a static binary suit it,
# and it lands wherever the server does. `cardinal-agent` runs unattended as root
# on every machine in a fleet, so it needs to be a package the machine's own
# package manager installs, upgrades and can be asked about.
#
# The agent is deliberately not a container. It serves a socket nss-systemd must
# reach, writes /etc/sudoers.d, manages sshd trust configuration, and has to
# survive a reboot before any container runtime starts — all the operational cost
# of containerising, none of the isolation.

version: 2

before:
  hooks:
    - go mod tidy
    # The admin UI, before any Go build. //go:embed all:dist takes whatever is
    # in web/dist at compile time, so without this a release binary ships an
    # empty directory and serves a blank page — with no build error, because an
    # empty embed is a valid embed.
    #
    # Here rather than only in the Dockerfile so the archives and the image
    # contain the same UI. Two build paths that each compile their own would be
    # two things to keep in step.
    - sh -c "cd web && npm ci && npm run build"

builds:
  - id: cardinal
    main: ./cmd/cardinal
    binary: cardinal
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      # These land on symbols that exist. The previous pair named
      # `main.version` and `main.commit`, which no package declared — and Go
      # discards an -X for an unknown symbol without a warning, so every
      # release binary carried nothing. The version itself is a constant in
      # internal/version now, generated from the VERSION file, because a
      # constant cannot fail this way: a missing one does not compile.
      - -X go.londer.be/cardinal/internal/version.Commit={{.FullCommit}}
      - -X go.londer.be/cardinal/internal/version.Date={{.Date}}

  - id: cardinal-agent
    main: ./cmd/cardinal-agent
    binary: cardinal-agent
    env: [CGO_ENABLED=0]
    # Linux only, and that is not an oversight. The agent's whole job is
    # systemd's userdb interface, /etc/sudoers.d and sshd — none of which exist
    # anywhere else.
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X go.londer.be/cardinal/internal/version.Commit={{.FullCommit}}
      - -X go.londer.be/cardinal/internal/version.Date={{.Date}}

# One archive per binary, rather than one archive holding whatever was built for
# that platform.
#
# A single globbing archive puts two binaries in the linux tarballs and one in
# the darwin tarballs, because the agent is linux-only — goreleaser refuses that
# outright, and it is right to: `cardinal_0.1.0_darwin_arm64.tar.gz` and
# `cardinal_0.1.0_linux_arm64.tar.gz` would contain different things under
# names that promise the same thing.
archives:
  - id: cardinal
    ids: [cardinal]
    formats: [tar.gz]
    name_template: >-
      cardinal_{{ .Version }}_{{ .Os }}_{{ .Arch }}

  # Linux only, and mostly a fallback: the agent writes to /etc/sudoers.d and
  # needs a systemd unit, so the .deb and .rpm below are how it is meant to be
  # installed. The tarball is for distributions neither of those covers.
  - id: cardinal-agent
    ids: [cardinal-agent]
    formats: [tar.gz]
    name_template: >-
      cardinal-agent_{{ .Version }}_{{ .Os }}_{{ .Arch }}

nfpms:
  - id: cardinal-agent
    package_name: cardinal-agent
    ids: [cardinal-agent]
    formats: [deb, rpm]

    vendor: Cardinal
    homepage: https://github.com/Londer-Org/Cardinal
    maintainer: Arthur Lonfils <alon@londer.be>
    description: |
      Cardinal agent — POSIX identity, sudo rules and host certificates.

      Serves directory identity to nss-systemd over systemd's userdb interface,
      renders the sudoers drop-in Cardinal's policy decides, and keeps this
      machine's SSH host certificate current. Answers from a local cache, so a
      Cardinal outage does not lock anybody out.
    license: Apache-2.0
    section: admin

    dependencies:
      # nss-systemd is what actually consults the agent. Without it the socket
      # exists and nothing ever asks it anything.
      - libnss-systemd
    overrides:
      rpm:
        dependencies:
          - systemd

    recommends:
      # Without visudo the agent installs no sudoers file at all, because it
      # refuses to write one it could not check first. Recommended rather than
      # required: a host may run the agent purely for identity.
      - sudo

    contents:
      - src: packaging/cardinal-agent.service
        dst: /usr/lib/systemd/system/cardinal-agent.service

      - src: packaging/agent.toml
        dst: /etc/cardinal/agent.toml
        type: config|noreplace

      - dst: /var/lib/cardinal
        type: dir
        file_info: {mode: 0o750}

    # Deliberately no postinstall script.
    #
    # The two edits this machine needs — `systemd` in nsswitch.conf and
    # `@includedir` in /etc/sudoers — are exactly the ones the agent refuses to
    # make itself, and it would be strange for the package to be allowed what the
    # daemon is not. A security product that reorders how a machine resolves
    # every username, as a side effect of an install somebody did to have a look,
    # is the surprise that costs people's trust.
    #
    # `cardinal-agent doctor` reports precisely what is missing and how to fix
    # it. The unit is not enabled on install for the same reason.

dockers_v2:
  # Multi-platform in one entry: goreleaser builds both architectures and
  # publishes the manifest, so `docker pull londerbe/cardinal:0.1.0` finds
  # something. The older `dockers` + `docker_manifests` pair does the same job
  # and is being phased out, and writing a deprecated form on the day the
  # release pipeline is created is how a project acquires its first migration.
  #
  # The plan calls container images the primary distribution, and goreleaser
  # was producing archives and packages and no images at all.
  - id: cardinal
    ids: [cardinal]
    dockerfile: Dockerfile.release
    platforms: [linux/amd64, linux/arm64]
    images:
      - londerbe/cardinal
    tags:
      - "{{ .Version }}"
      # Only for a real release. A prerelease taking `latest` would be pulled
      # by everything that does not pin, which is most things.
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.title: cardinal
      org.opencontainers.image.description: A directory and identity platform built on Go and PostgreSQL
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.source: https://github.com/Londer-Org/Cardinal
      org.opencontainers.image.licenses: Apache-2.0

release:
  github:
    owner: Londer-Org
    name: Cardinal

  # Pre-1.0 and not production ready, which the README and ROADMAP say and a
  # release page should not quietly contradict by looking finished.
  prerelease: auto
  header: |
    Cardinal {{ .Tag }} — **pre-1.0, not production ready.** There is no stable
    API, no upgrade path between versions, and no security audit.

    Container image: `docker pull londerbe/cardinal:{{ trimprefix .Tag "v" }}`
    Documentation: https://londer-org.github.io/Cardinal/

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  # No exclude filters. They used to drop '^docs:', '^test:' and '^chore:',
  # which are Conventional Commits prefixes — and CLAUDE.md forbids that style
  # here, so no subject has ever matched one. Configuration that filters
  # nothing still reads as a filtered list, which is worse than no filter.
  #
  # What these notes give you is the subjects since the last tag. What an
  # operator needs — which entries are security fixes and what to do about them
  # — is CHANGELOG.md, written by hand for exactly that reason.
