# Cardinal configuration for the end-to-end stack.
#
# ┌───────────────────────────────────────────────────────────────────────────┐
# │ THIS IS A TEST FIXTURE. The signing-key encryption key below is committed, │
# │ git, readable by anyone. It grants emergency access to any account.        │
# │                                                                           │
# │ Nothing here is a template for production. Generate your own key with     │
# │ `openssl rand -base64 32` for a real deployment.                           │
# └───────────────────────────────────────────────────────────────────────────┘

[server]
# 0.0.0.0 because this runs in a container: 127.0.0.1 would be the container's
# own loopback and Traefik could not reach it.
listen = "0.0.0.0:8080"
public_url = "https://id.cardinal.test:8443"

# The session cookie is scoped to the parent domain, so signing in at
# id.cardinal.test is also being signed in at app.cardinal.test.
#
# Without this, forwardAuth single sign-on does not work at all: the browser
# simply never sends a cookie set on one sibling host to another. It is the
# setting that turns "logged into Cardinal" into "logged in".
#
# The cost, stated plainly: this cookie reaches EVERY subdomain. Never host
# untrusted or user-generated content under a domain you scope a session to.
#
# This said "localhost" for a long time, and every browser silently threw the
# cookie away: a Domain attribute that is a public suffix is discarded, and
# `localhost` is one. Nobody could sign in and every mutation failed CSRF, while
# the Go end-to-end suite passed — net/http/cookiejar accepts what browsers
# refuse. Configuration validation now rejects a single-label domain outright.
cookie_domain = "cardinal.test"

# Traefik is the only route in, so its forwarded client addresses are
# trustworthy. This holds ONLY because protected-app is not published to the
# host — see the comment in compose.yml. The Docker bridge range covers the
# compose network without pinning a container IP that changes on recreate.
trusted_proxies = ["172.16.0.0/12", "127.0.0.1/32"]

# One consequence, visible the moment you look at "Where you are signed in":
# every session in this stack records Traefik's address rather than the
# browser's.
#
# That is the resolver working, not failing. A browser on the host reaches the
# containers through Docker's NAT, so Traefik sees the bridge gateway
# (172.22.0.1) as the source and forwards it — and the gateway is inside the
# range above, so every hop in the chain is a trusted proxy and there is no
# untrusted address to attribute to. Cardinal reports the peer rather than
# inventing one.
#
# The general rule is worth carrying to production: a trusted_proxies range
# wider than your actual proxies silently destroys client attribution. Here it
# is the honest trade, because pinning a container IP that changes on every
# recreate would break the stack instead. In a real deployment, list the
# proxies.

[database]
dsn = "postgres://cardinal:cardinal@postgres:5432/cardinal?sslmode=disable"

[webauthn]
# rp_id "cardinal.test" covers id. and app.cardinal.test, since both are
# subdomains of it.
#
# The reason this stack is served over TLS at all. WebAuthn requires a secure
# context, and the only http origins browsers consider trustworthy are
# localhost, 127.0.0.1 and *.localhost — which is exactly the set that cannot
# carry a parent-domain cookie. Measured, not assumed: on
# http://id.cardinal.test, `window.PublicKeyCredential` is undefined, so the
# enrollment page correctly reports that passkeys are unavailable.
#
# So the two requirements together — SSO across sibling hosts, and passkeys —
# admit exactly one arrangement: a real domain over HTTPS with a certificate the
# browser trusts. `make e2e-up` says how.
rp_id = "cardinal.test"
rp_display_name = "Cardinal (end-to-end stack)"
origins = ["https://id.cardinal.test:8443"]

[recovery]
email_enabled = false

[oidc]
enabled = true

# A fixture. Generate your own with
# `openssl rand -base64 32` and keep it wherever the deployment's secrets live.
signing_key_encryption_key = "e2e-fixture-signing-key-encryption-not-for-real-use"

[ssh]
enabled = true

# Another fixture, and deliberately a different value from the OIDC one above.
# ADR 0021: whoever holds this key can mint a certificate for any user on any
# host, so one leaked configuration file must not yield both the token signer
# and the fleet. Reusing the value here would make the example teach the wrong
# lesson — and the config validator refuses it outright.
ca_encryption_key = "e2e-fixture-ssh-ca-encryption-key-not-for-real-use"

[x509]
enabled = true

# A third fixture, and a third distinct value. The config validator refuses two
# authorities sharing an encryption key — one leaked file must not yield both.
ca_encryption_key = "e2e-fixture-x509-ca-encryption-key-not-for-real-use"

# The ACME base URL, which is now simply the stack's own URL.
#
# This used to be a second entrypoint on a second port: everything else was
# plain HTTP, and RFC 8555 §6.1 requires HTTPS, so ACME needed somewhere of its
# own. Moving the whole stack to TLS for WebAuthn's sake collapsed that — one
# entrypoint, one scheme, one URL.
#
# Still worth noticing as a deployment fact rather than a test detail:
# Cardinal's own ACME endpoint cannot get its certificate from Cardinal's ACME.
# The first certificate always comes from somewhere else — here, mkcert.
public_url = "https://id.cardinal.test:8443"
