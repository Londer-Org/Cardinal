# End-to-end stack: PostgreSQL, Cardinal, Traefik, and a protected application.
#
# Run with `make e2e-up` from the repository root. The test suite in test/e2e
# drives this same stack, so it stays honest rather than rotting into a demo
# nobody runs.
#
# Hostnames use *.localhost, which resolves to 127.0.0.1 without touching
# /etc/hosts and which browsers treat as a secure context — so WebAuthn works
# here over plain HTTP, as it would nowhere else.

name: cardinal-e2e

services:
  postgres:
    image: postgres:19beta2
    environment:
      POSTGRES_USER: cardinal
      POSTGRES_PASSWORD: cardinal
      POSTGRES_DB: cardinal
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - e2e-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardinal -d cardinal"]
      interval: 3s
      timeout: 3s
      retries: 15

  # Migrations run as their own step, not as a side effect of starting the
  # server. Applying a schema change while other replicas still serve the old
  # one is how rolling deploys break; making it a separate unit means it is a
  # decision rather than something that happens.
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./cardinal.e2e.toml:/etc/cardinal/cardinal.toml:ro
    environment:
      CARDINAL_DSN: "postgres://cardinal:cardinal@postgres:5432/cardinal?sslmode=disable"
    command: ["migrate"]
    restart: "no"

  cardinal:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./cardinal.e2e.toml:/etc/cardinal/cardinal.toml:ro
    # No -dev. The stack is served over TLS with a certificate the browser
    # trusts, so cookies are Secure and the full CSP applies — which is the
    # production shape rather than a relaxed one.
    #
    # It used to need -dev because everything was plain HTTP. That arrangement
    # could not have worked in a browser anyway: the parent-domain cookie SSO
    # depends on was being discarded, silently, on every response.
    command: ["serve", "-config", "/etc/cardinal/cardinal.toml"]
    environment:
      # The published port ends up inside two settings the config file cannot
      # know: the OIDC issuer, which every token carries and every client
      # compares literally, and the WebAuthn origin, which an assertion is
      # checked against. Both come from the environment so overriding
      # CARDINAL_PORT moves the whole stack rather than half of it.
      CARDINAL_PUBLIC_URL: "https://id.cardinal.test:${CARDINAL_PORT:-8443}"
      CARDINAL_WEBAUTHN_ORIGINS: "https://id.cardinal.test:${CARDINAL_PORT:-8443}"
      CARDINAL_X509_PUBLIC_URL: "https://id.cardinal.test:${CARDINAL_PORT:-8443}"
    healthcheck:
      test: ["CMD", "/usr/local/bin/cardinal", "audit", "verify",
             "-dsn", "postgres://cardinal:cardinal@postgres:5432/cardinal?sslmode=disable"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  traefik:
    image: traefik:v3.6
    networks:
      default:
        # Containers resolve the public hostnames to Traefik, so the relying
        # party fetches discovery from exactly the URL the browser uses.
        #
        # This is not a test convenience: an OIDC issuer must be reachable at
        # one identifier from both the browser and the backend, because the
        # issuer in the token has to match what the client discovered. Papering
        # over it with a separate internal URL is how "issuer mismatch" bugs
        # reach production.
        aliases:
          - id.cardinal.test
          - app.cardinal.test
          - client.cardinal.test
    depends_on:
      - cardinal
      - protected-app
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      # Port 8100 inside the network as well as outside, so the issuer URL
      # https://id.cardinal.test:8443 resolves identically from the browser and from
      # a container. An OIDC issuer must be one identifier everywhere: the
      # value in the token has to match what the client discovered, and papering
      # over a difference with a separate internal URL is how "issuer mismatch"
      # reaches production.
      - --entrypoints.web.address=:${CARDINAL_HTTP_PORT:-8100}
      # TLS, for ACME. Its own port so nothing already using 8100 changes.
      - --entrypoints.websecure.address=:${CARDINAL_PORT:-8443}
      - --api.dashboard=false
      - --log.level=INFO
      # Access logs make it visible which requests were admitted and which the
      # middleware turned away — the first thing anyone debugging forwardAuth
      # wants to see.
      - --accesslog=true
    environment:
      # Read by the redirect in dynamic.yml, which has to name the port a
      # browser can reach rather than the one inside the container — those
      # differ whenever CARDINAL_PORT is overridden.
      CARDINAL_PORT: "${CARDINAL_PORT:-8443}"
    ports:
      # Same port inside and out, deliberately.
      #
      # An OIDC issuer must be one identifier everywhere: the value in a token
      # has to match what the client discovered, and the relying party in this
      # stack discovers it from *inside* the network. Publishing 8643:8443
      # would give the browser one URL and that container another, which is
      # exactly the "issuer mismatch" this file warns about below — so
      # overriding the port moves the entrypoint too.
      - "${CARDINAL_HTTP_PORT:-8100}:${CARDINAL_HTTP_PORT:-8100}"
      - "${CARDINAL_PORT:-8443}:${CARDINAL_PORT:-8443}"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik/tls:/etc/traefik/tls:ro

  # An OpenID Connect relying party, using coreos/go-oidc.
  #
  # Deliberately a different library from the one the provider is built on:
  # zitadel's server satisfying zitadel's client would mostly prove they agree
  # with each other.
  oidc-client:
    build:
      context: ./oidc-client
    depends_on:
      cardinal:
        condition: service_started
    environment:
      OIDC_ISSUER: "https://id.cardinal.test:${CARDINAL_PORT:-8443}"
      OIDC_REDIRECT_URL: "https://client.cardinal.test:${CARDINAL_PORT:-8443}/callback"
      LISTEN: "0.0.0.0:8000"
      # Set by `make e2e-seed`, which registers the client and writes the id
      # into examples/.oidc-client-id.
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"

      # The relying party has to trust the CA that signed Cardinal's
      # certificate, and a container inherits nothing from the host's trust
      # store. This is not a demo wrinkle: it is the same work every workload
      # needs against an internal CA, and the thing `cardinal x509 ca init`
      # warns takes the time.
      #
      # SSL_CERT_FILE replaces the pool rather than adding to it, which is fine
      # for a client that talks to exactly one host and would be wrong for
      # anything that also reaches the public internet.
      SSL_CERT_FILE: /etc/ssl/local-ca.pem
    volumes:
      # Copied here by `make e2e-up` rather than referenced at mkcert's path
      # through an environment variable: compose interpolates volumes on every
      # invocation, so a required variable would break `docker compose exec`
      # for anything that did not go through make — including the end-to-end
      # suite, which shells out to it constantly.
      #
      # It is a public root certificate. The directory is gitignored anyway,
      # because the leaf's private key lives beside it.
      - ./traefik/tls/local-ca.pem:/etc/ssl/local-ca.pem:ro
    expose:
      - "8000"

  protected-app:
    build:
      context: ./protected-app
    environment:
      LISTEN: "0.0.0.0:8000"
    # Deliberately NOT published to the host. The application trusts its
    # identity headers unconditionally, which is only safe because it cannot be
    # reached except through Traefik. Publishing a port here would quietly make
    # this stack a bad example.
    expose:
      - "8000"

volumes:
  e2e-pgdata:
