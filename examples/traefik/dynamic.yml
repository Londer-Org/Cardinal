# Traefik dynamic configuration.
#
# The interesting part is the middleware: forwardAuth is what turns Cardinal
# into an enforcement point for applications that know nothing about it.

http:
  middlewares:
    # Plain HTTP goes to HTTPS and nowhere else. Permanent, so a browser stops
    # asking after the first time.
    https-redirect:
      redirectScheme:
        scheme: https
        port: "{{ env "CARDINAL_PORT" }}"
        permanent: true

    cardinal-auth:
      forwardAuth:
        # Traefik makes a sub-request here for every request to a protected
        # route. A 2xx admits the original request; anything else is returned
        # to the client instead — which is how the 302 to the login page and
        # the 403 with an explanation both reach the browser.
        address: "http://cardinal:8080/api/auth/verify"

        # false means Traefik sets X-Forwarded-* itself and discards whatever
        # the client sent.
        #
        # This is the setting that makes Cardinal's trusted_proxies safe. With
        # true, a client could send its own X-Forwarded-For, Traefik would pass
        # it through, and Cardinal — trusting Traefik — would believe it. The
        # two settings have to agree, and this is the half that is easy to get
        # wrong because `true` sounds like the trusting option and is in fact
        # the credulous one.
        trustForwardHeader: false

        # ONLY these response headers are copied onto the original request.
        #
        # Anything Cardinal sets that is not listed here is silently dropped —
        # which is the single most common cause of "the header worked in curl
        # but not through Traefik". Adding a header on the Cardinal side means
        # adding it here too.
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Preferred-Username
          - X-Auth-Request-Name
          - X-Auth-Request-Groups
          - X-Auth-Request-Auth-Method
          - X-Auth-Request-Device-Bound
          - X-Cardinal-Policy

    # Strips any inbound X-Auth-Request-* headers before the auth middleware
    # runs.
    #
    # Defence in depth: forwardAuth overwrites the ones it sets, but a header it
    # does not set would pass straight through to the backend. An application
    # reading a header Cardinal never emits would be trusting the client.
    strip-identity:
      headers:
        customRequestHeaders:
          X-Auth-Request-User: ""
          X-Auth-Request-Preferred-Username: ""
          X-Auth-Request-Name: ""
          X-Auth-Request-Groups: ""
          X-Auth-Request-Auth-Method: ""
          X-Auth-Request-Device-Bound: ""
          X-Cardinal-Policy: ""

  routers:
    # Everything is TLS now, and that is not a nicety.
    #
    # WebAuthn needs a secure context, and the only http origins browsers treat
    # as one are localhost, 127.0.0.1 and *.localhost — precisely the names that
    # cannot carry a parent-domain cookie, which forwardAuth single sign-on
    # requires. Passkeys and SSO in the same stack therefore force a real domain
    # over HTTPS. The certificate comes from mkcert; `make e2e-up` says how.
    #
    # It also means the stack no longer runs with -dev: cookies are Secure and
    # the full CSP applies, so what is exercised here is the production shape
    # rather than a relaxed one.

    # Cardinal itself: never behind the auth middleware, or signing in would
    # require being signed in.
    cardinal:
      rule: "Host(`id.cardinal.test`)"
      service: cardinal
      entryPoints: [websecure]
      tls: {}

    # The protected application. Strip first, then authenticate.
    protected-app:
      rule: "Host(`app.cardinal.test`)"
      service: protected-app
      entryPoints: [websecure]
      tls: {}
      middlewares: [strip-identity, cardinal-auth]

    # The OpenID Connect relying party. NOT behind forwardAuth: it does its own
    # authentication, via the provider, which is the whole point — an
    # application that speaks OIDC does not need a proxy in front of it.
    oidc-client:
      rule: "Host(`client.cardinal.test`)"
      service: oidc-client
      entryPoints: [websecure]
      tls: {}

    # The same application with no auth, for the end-to-end test to prove the
    # middleware is what makes the difference rather than something incidental.
    # Never do this in a real deployment.
    unprotected-app:
      rule: "Host(`open.cardinal.test`)"
      service: protected-app
      entryPoints: [websecure]
      tls: {}

    # Plain HTTP exists only to send people to HTTPS. Without it, an old
    # bookmark or a typed hostname lands on a connection refused, which reads as
    # the stack being down.
    redirect-to-https:
      rule: "HostRegexp(`^.+\\.cardinal\\.test$`)"
      service: cardinal
      entryPoints: [web]
      middlewares: [https-redirect]

  services:
    cardinal:
      loadBalancer:
        servers:
          - url: "http://cardinal:8080"
    protected-app:
      loadBalancer:
        servers:
          - url: "http://protected-app:8000"
    oidc-client:
      loadBalancer:
        servers:
          - url: "http://oidc-client:8000"

tls:
  certificates:
    # Generated by `make e2e-up` with mkcert, and never committed: it is a
    # certificate for a domain anybody can claim on their own machine, and a
    # committed private key in a security project is a bad habit even when the
    # key is worthless.
    - certFile: /etc/traefik/tls/cardinal.test.crt
      keyFile: /etc/traefik/tls/cardinal.test.key
