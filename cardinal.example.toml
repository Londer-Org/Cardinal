# Cardinal configuration.
#
# Copy to cardinal.toml and edit. Values without a safe default have none:
# Cardinal refuses to start rather than guess, because a system that boots with
# a plausible-looking wrong value is worse than one that will not boot.

[server]
# Loopback by default, so an unconfigured server is not exposed by accident.
#
# In a container this must be "0.0.0.0:8080" instead: 127.0.0.1 inside a
# container is that container's own loopback, so a published port reaches
# nothing and the symptom is a healthy-looking process nobody can connect to.
listen = "127.0.0.1:8080"

# Externally reachable base URL, behind whatever proxy terminates TLS.
public_url = "https://id.example.com"

# Reverse proxies permitted to set X-Forwarded-For, as CIDRs or bare addresses.
#
# Empty means trust nothing, and that is the safe default: X-Forwarded-For is
# attacker-controlled unless a proxy overwrites it, so honouring it
# unconditionally lets anyone evade rate limiting with a header.
#
# Set it only when Cardinal is genuinely unreachable except through the proxy —
# the property that makes trusting the header sound is network isolation, not
# the setting itself. If anything can connect directly (a pod network, a debug
# port, a misrouted service), an attacker on that path forges the header and
# this line becomes the vulnerability rather than the fix.
#
# Cardinal walks the chain from the RIGHT, skipping trusted hops, and takes the
# first untrusted address. Reading left-to-right — what most implementations do
# — would trust the part the client writes.
trusted_proxies = []

[database]
# May also be supplied as CARDINAL_DSN, which is preferable in production:
# a secret in a file gets committed, copied and backed up.
dsn = "postgres://cardinal@localhost:5433/cardinal?sslmode=require"
max_conns = 10
conn_max_lifetime = "1h"

[webauthn]
# ── This value is effectively permanent. ─────────────────────────────────────
# rp_id is baked into every credential at registration. Changing it invalidates
# every passkey ever issued, meaning every user must re-enrol, in person, at
# once. Decide it deliberately.
#
# A bare domain: no scheme, no port, no path. Use the registrable parent if you
# might later serve authentication from sibling subdomains — "example.com"
# covers id.example.com and login.example.com; "id.example.com" does not.
rp_id = "example.com"

rp_display_name = "Example Corp"

# Exact origins permitted to authenticate, including scheme and port. Listed
# explicitly rather than derived, so a misconfigured proxy cannot silently widen
# what may authenticate. Each must fall within rp_id.
origins = ["https://id.example.com"]

[break_glass]
# Generated offline with `cardinal break-glass generate`.
#
# This lives in the config file and NOT the database, deliberately: a database
# compromise cannot substitute an attacker's key here, and a restore cannot
# silently roll it back to an older one. See docs/adr/0009.
#
# The matching private key must never touch this host. Store it offline,
# reachable by at least two people, and test it quarterly.
public_key = "cardinal-bg-v1:REPLACE_ME"

[recovery]
# Recovery email is OFF by default, and that default is a security position
# rather than laziness.
#
# Enabling it means accepting two things:
#   1. Your mail provider becomes a root of trust for Cardinal recovery.
#   2. Anyone who can read or reset a mailbox — including your mail
#      administrators — can intercept a recovery message, and so becomes an
#      implicit Cardinal administrator for those users.
#
# Cardinal cannot judge whether your mail platform is strong enough for that.
# You must.
#
# It is never sufficient alone, and never available for administrators:
# consequence (2) would place Cardinal's admin tier beneath your mail
# platform's. Admin recovery is dual-control or break-glass.
email_enabled = false

# Domains acceptable for recovery addresses. Required when enabled — an
# unrestricted recovery domain would let any mailbox anywhere recover any
# account.
#
# Cardinal refuses to act as the identity provider for any domain listed here.
# Federating your mail domain to Cardinal would mean an outage takes the
# recovery channel down with it — and that loop is normally created much later,
# by someone changing something unrelated. Cardinal enforces the rule instead of
# trusting you to remember it.
email_domains = []
