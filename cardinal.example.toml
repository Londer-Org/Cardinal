# Cardinal configuration.
#
# Copy to cardinal.toml and edit. Values without a safe default have none:
# Cardinal refuses to start rather than guess, because a system that boots with
# a plausible-looking wrong value is worse than one that will not boot.

[server]
# Loopback by default, so an unconfigured server is not exposed by accident.
#
# In a container this must be "0.0.0.0:8080" instead: 127.0.0.1 inside a
# container is that container's own loopback, so a published port reaches
# nothing and the symptom is a healthy-looking process nobody can connect to.
listen = "127.0.0.1:8080"

# Externally reachable base URL, behind whatever proxy terminates TLS.
public_url = "https://id.example.com"

# Reverse proxies permitted to set X-Forwarded-For, as CIDRs or bare addresses.
#
# Empty means trust nothing, and that is the safe default: X-Forwarded-For is
# attacker-controlled unless a proxy overwrites it, so honouring it
# unconditionally lets anyone evade rate limiting with a header.
#
# Set it only when Cardinal is genuinely unreachable except through the proxy —
# the property that makes trusting the header sound is network isolation, not
# the setting itself. If anything can connect directly (a pod network, a debug
# port, a misrouted service), an attacker on that path forges the header and
# this line becomes the vulnerability rather than the fix.
#
# Cardinal walks the chain from the RIGHT, skipping trusted hops, and takes the
# first untrusted address. Reading left-to-right — what most implementations do
# — would trust the part the client writes.
trusted_proxies = []

# Scopes the session cookie to a parent domain, so one sign-in covers every
# application behind the proxy.
#
# Required for forwardAuth single sign-on: without it the cookie is bound to the
# host that set it, and a session established at id.example.com is never sent to
# app.example.com — sign-in appears to work and then loops.
#
# The cost, before you set it: a cookie scoped to "example.com" is sent to EVERY
# subdomain. Anything able to read cookies on any subdomain can take the
# session, so untrusted or user-generated content belongs on a separate
# registrable domain rather than a subdomain of this one.
#
# Empty means host-only — correct and safe for a single-application deployment.
#
# It must contain a dot if it is set at all. Browsers discard a cookie whose
# Domain attribute is a public suffix, so "localhost", "test" and any other
# single label produce a session no browser will store: sign-in loops, every
# mutation fails CSRF, and nothing anywhere says why. Cardinal refuses to start
# on one rather than let that happen quietly — it happened to this project's own
# example stack, for months, with a full test suite passing.
cookie_domain = ""

[database]
# May also be supplied as CARDINAL_DSN, which is preferable in production:
# a secret in a file gets committed, copied and backed up.
dsn = "postgres://cardinal@localhost:5433/cardinal?sslmode=require"
max_conns = 10
conn_max_lifetime = "1h"

[webauthn]
# ── This value is effectively permanent. ─────────────────────────────────────
# rp_id is baked into every credential at registration. Changing it invalidates
# every passkey ever issued, meaning every user must re-enrol, in person, at
# once. Decide it deliberately.
#
# A bare domain: no scheme, no port, no path. Use the registrable parent if you
# might later serve authentication from sibling subdomains — "example.com"
# covers id.example.com and login.example.com; "id.example.com" does not.
rp_id = "example.com"

rp_display_name = "Example Corp"

# Exact origins permitted to authenticate, including scheme and port. Listed
# explicitly rather than derived, so a misconfigured proxy cannot silently widen
# what may authenticate. Each must fall within rp_id.
origins = ["https://id.example.com"]

[sessions]
# How long a session survives without being used. It slides: using Cardinal
# pushes it forward, so nobody is signed out mid-task because of when they
# started. Eight hours is a working day.
#
# Shorter is tempting and is the setting that gets raised. A control people
# route around is worse than a looser one they keep — and an hour is long
# enough to be defeated by lunch. Set it shorter if you mean it.
idle = "8h"

# The hard end, never extended. This is what makes "everybody re-authenticates
# eventually" true rather than aspirational: sliding expiry with no cap means a
# stolen cookie lasts indefinitely provided somebody keeps using it.
absolute = "7d"

# Neither governs administration. Changing the directory needs a device-bound
# key used within five minutes regardless of session age, and that rule lives in
# policies/cardinal.cedar where it can be read and changed like every other one.

[recovery]
# There is no email recovery channel, and there is not going to be one.
#
# ADR 0009 rules it out: mail can never be sufficient alone, and never available
# for administrators, because anyone who can read or reset a mailbox — including
# your mail administrators — would become an implicit Cardinal administrator for
# those users. Recovery is a code from the sheet you printed, or two
# administrators agreeing. Administrative recovery is `cardinal invite <admin>`
# on the host.
#
# A setting called email_enabled used to sit here. It validated, it appeared on
# the configuration page, and it enabled nothing. It was removed in 0.2.0, and
# Cardinal now refuses to start on a file that still sets it rather than
# ignoring the line.

# The domains recovery mail is delivered to.
#
# Cardinal refuses to act as the identity provider for any of them, and that
# rule does not depend on a recovery channel existing: enrollment and recovery
# invitations carry a link, and the link is mailed. Federate the mailbox domain
# to Cardinal and an outage takes the way back in with it — a loop normally
# created much later, by somebody changing something unrelated.
#
# Empty turns the check off, which is the honest reading of "I have not told
# Cardinal where recovery mail goes".
email_domains = []

[oidc]
# The OpenID Connect provider. Off by default: an identity provider nobody has
# registered clients for is attack surface without a purpose.
enabled = false

# Encrypts the token-signing key at rest.
#
# Held here rather than in the database, so a database read alone is not enough
# (ADR 0009). The signing key can forge tokens for EVERY registered
# application, so storing it in the clear would make a database read a complete
# compromise of every downstream system — arguably worse than losing the
# directory itself. With this, an attacker needs both.
#
# Generate with: openssl rand -base64 32
#
# Losing it makes every issued token unverifiable and forces every client to
# re-fetch the JWKS, so keep it wherever this deployment keeps its secrets.
signing_key_encryption_key = ""

[ssh]
# Host access by short-lived SSH certificates. Off until hosts are enrolled.
enabled = false
# Encrypts the certificate authority's private key at rest. Deliberately its
# own value: whoever holds the CA key can log into every host as anybody, so
# one leaked file must not yield both this and the token signer (ADR 0021).
# Generate with `openssl rand -base64 32`.
ca_encryption_key = ""
