# Traefik, the shared edge.
#
# The same version and the same role as in examples/compose.yml — it terminates
# TLS and it is where forwardAuth runs — but configured through Kubernetes
# resources rather than a mounted dynamic.yml. That is not decoration: an
# IngressRoute in the `example` namespace referring to a Middleware in the
# `traefik` namespace is exactly the cross-boundary reference a real deployment
# makes, and it either has permission or it does not.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: traefik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik
rules:
  - apiGroups: [""]
    # configmaps is not optional even though nothing here uses one: the
    # Kubernetes provider watches them regardless, and without permission it
    # logs a forbidden error several times a second forever.
    resources: [services, endpoints, secrets, configmaps, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch]
  - apiGroups: [extensions, networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [extensions, networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
  - apiGroups: [traefik.io]
    resources:
      - middlewares
      - middlewaretcps
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - traefikservices
      - tlsoptions
      - tlsstores
      - serverstransports
      - serverstransporttcps
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: traefik
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: traefik
spec:
  replicas: 1
  selector:
    matchLabels: {app: traefik}
  template:
    metadata:
      labels: {app: traefik}
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.6
          args:
            - --providers.kubernetescrd
            # Without this, an IngressRoute may not reference a Middleware in
            # another namespace — and every route here does, because the
            # middlewares belong to the edge rather than to the applications.
            - --providers.kubernetescrd.allowcrossnamespace=true
            - --entrypoints.web.address=:80
            - --entrypoints.websecure.address=:443
            - --api.dashboard=false
            # The probes below hit /ping, and /ping is not served unless both
            # of these are set — the endpoint is opt-in and it answers on its
            # own entrypoint rather than on web or websecure.
            - --ping=true
            - --entrypoints.traefik.address=:8080
            - --log.level=INFO
            # Access logs make it visible which requests were admitted and which
            # the middleware turned away — the first thing anyone debugging
            # forwardAuth wants to see.
            - --accesslog=true
          ports:
            - {name: web, containerPort: 80}
            - {name: websecure, containerPort: 443}
            - {name: admin, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /ping, port: admin}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: {path: /ping, port: admin}
            initialDelaySeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik
spec:
  # LoadBalancer works here because Docker Desktop runs cloud-provider-kind,
  # which assigns one and forwards from the host. Ports 80 and 443 rather than
  # compose's 8100/8443: nothing on this machine holds them, and it lets the
  # issuer be `https://id.cardinal.test` with no port — one fewer place for the
  # browser's URL and the token's issuer claim to disagree.
  type: LoadBalancer
  selector: {app: traefik}
  ports:
    - {name: web, port: 80, targetPort: web}
    - {name: websecure, port: 443, targetPort: websecure}
---
# The default certificate for every route that says `tls: {}`, which is the
# equivalent of the `tls.certificates` block in examples/traefik/dynamic.yml.
#
# It is mkcert's, and it has to be: WebAuthn needs a secure context, and the only
# http origins browsers treat as one are localhost, 127.0.0.1 and *.localhost —
# precisely the names that cannot carry the parent-domain cookie forwardAuth
# single sign-on depends on. Passkeys and SSO in one stack therefore force a real
# domain over HTTPS with a certificate the browser already trusts.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: traefik
spec:
  defaultCertificate:
    secretName: cardinal-test-tls
