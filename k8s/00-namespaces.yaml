# Three namespaces, standing in for three estates.
#
# `cardinal` is the identity platform and the only place its database exists.
# `example` is the applications that consume it and have no privileged access to
# it. `traefik` is the shared edge both sit behind.
#
# The separation is the point of running this in Kubernetes rather than compose:
# in compose every container shares one network and can reach every other, so
# "the application cannot read Cardinal's database" is a claim nothing enforces.
# Here it is a NetworkPolicy, and the end-to-end checks prove it by trying.
apiVersion: v1
kind: Namespace
metadata:
  name: cardinal
  labels:
    kubernetes.io/metadata.name: cardinal
---
apiVersion: v1
kind: Namespace
metadata:
  name: example
  labels:
    kubernetes.io/metadata.name: example
---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  labels:
    kubernetes.io/metadata.name: traefik
