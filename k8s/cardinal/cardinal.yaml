# Cardinal itself.
#
# The configuration is a Secret rather than a ConfigMap, and that is a decision
# rather than caution. Only four settings can come from the environment
# (CARDINAL_DSN, CARDINAL_PUBLIC_URL, CARDINAL_WEBAUTHN_ORIGINS,
# CARDINAL_X509_PUBLIC_URL); the three encryption keys can only be written in the
# file. A file containing key material is secret material whatever else is in it,
# so the whole file is a Secret.
apiVersion: v1
kind: Secret
metadata:
  name: cardinal-config
  namespace: cardinal
type: Opaque
stringData:
  cardinal.toml: |
    # ┌─────────────────────────────────────────────────────────────────────────┐
    # │ THIS IS A FIXTURE. Every encryption key below is committed to git and    │
    # │ readable by anyone. Generate your own with `openssl rand -base64 32`.    │
    # └─────────────────────────────────────────────────────────────────────────┘

    [server]
    # 0.0.0.0 because this runs in a pod: 127.0.0.1 would be the pod's own
    # loopback and Traefik could not reach it.
    listen = "0.0.0.0:8080"
    public_url = "https://id.cardinal.test"

    # Scoped to the parent domain, so signing in at id.cardinal.test is also
    # being signed in at app.cardinal.test. Without this, forwardAuth single
    # sign-on does not work at all — the browser simply never sends a cookie set
    # on one sibling host to another.
    #
    # The cost, stated plainly: this cookie reaches EVERY subdomain. Never host
    # untrusted content under a domain you scope a session to.
    cookie_domain = "cardinal.test"

    # The pod CIDR, which is tighter than the compose stack's 172.16.0.0/12 and
    # correct for the same reason: the only thing that ever reaches Cardinal is
    # the Traefik pod, and pods are the only things in this range. A
    # trusted_proxies range wider than your actual proxies silently destroys
    # client attribution.
    trusted_proxies = ["10.244.0.0/16"]

    [database]
    dsn = "postgres://cardinal:cardinal@postgres.cardinal.svc.cluster.local:5432/cardinal?sslmode=disable"

    [webauthn]
    # rp_id "cardinal.test" covers id. and app.cardinal.test, since both are
    # subdomains of it.
    rp_id = "cardinal.test"
    rp_display_name = "Cardinal (Kubernetes stack)"
    origins = ["https://id.cardinal.test"]

    [recovery]
    email_enabled = false

    [oidc]
    enabled = true
    signing_key_encryption_key = "k8s-fixture-signing-key-encryption-not-for-real-use"

    [ssh]
    enabled = true
    # Deliberately a different value from the OIDC one above. ADR 0021: whoever
    # holds this key can mint a certificate for any user on any host, so one
    # leaked configuration file must not yield both the token signer and the
    # fleet. The config validator refuses two authorities sharing a key.
    ca_encryption_key = "k8s-fixture-ssh-ca-encryption-key-not-for-real-use"

    [x509]
    enabled = true
    ca_encryption_key = "k8s-fixture-x509-ca-encryption-key-not-for-real-use"
    public_url = "https://id.cardinal.test"
---
# Migrations run as their own unit, not as a side effect of starting the server.
#
# Applying a schema change while other replicas still serve the old one is how
# rolling deploys break; a Job means it is a decision rather than something that
# happens. The server waits for it via an init container rather than ordering,
# because Kubernetes has no `depends_on: service_completed_successfully`.
apiVersion: batch/v1
kind: Job
metadata:
  name: cardinal-migrate
  namespace: cardinal
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: {app: cardinal-migrate}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: londerbe/cardinal:0.1.0
          args: [migrate]
          env:
            - name: CARDINAL_DSN
              value: postgres://cardinal:cardinal@postgres.cardinal.svc.cluster.local:5432/cardinal?sslmode=disable
          volumeMounts:
            - {name: config, mountPath: /etc/cardinal, readOnly: true}
      volumes:
        - name: config
          secret: {secretName: cardinal-config}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cardinal
  namespace: cardinal
spec:
  replicas: 1
  selector:
    matchLabels: {app: cardinal}
  template:
    metadata:
      labels: {app: cardinal}
    spec:
      initContainers:
        # Waits for the migration Job to have actually applied something.
        #
        # Kubernetes has no equivalent of compose's
        # `depends_on: condition: service_completed_successfully`, and the
        # obvious substitute does not work: `cardinal migrate -status` exits 0
        # against a completely unmigrated database, having printed a header and
        # no rows, so it would wait for nothing. Asking the schema directly is
        # the check that cannot pass early.
        #
        # The postgres image rather than Cardinal's because Cardinal's is
        # distroless — no shell, so no loop.
        - name: wait-for-migrations
          image: postgres:19beta2
          command: [sh, -c]
          args:
            - |
              until psql "$DSN" -tAc \
                "select count(*) from schema_migrations" 2>/dev/null | grep -qE '^[1-9]'; do
                echo "waiting for migrations to be applied"
                sleep 2
              done
              echo "schema is migrated"
          env:
            - name: DSN
              value: postgres://cardinal:cardinal@postgres.cardinal.svc.cluster.local:5432/cardinal?sslmode=disable
      containers:
        - name: cardinal
          image: londerbe/cardinal:0.1.0
          # No -dev. Served over TLS with a certificate the browser trusts, so
          # cookies are Secure and the full CSP applies — the production shape
          # rather than a relaxed one.
          args: [serve, -config, /etc/cardinal/cardinal.toml]
          env:
            # These end up in the OIDC issuer, which every token carries and
            # every client compares literally, and in the WebAuthn origin, which
            # an assertion is checked against. They match the config file; they
            # are repeated here because overriding them has to move the whole
            # stack rather than half of it.
            - {name: CARDINAL_PUBLIC_URL, value: "https://id.cardinal.test"}
            - {name: CARDINAL_WEBAUTHN_ORIGINS, value: "https://id.cardinal.test"}
            - {name: CARDINAL_X509_PUBLIC_URL, value: "https://id.cardinal.test"}
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts:
            - {name: config, mountPath: /etc/cardinal, readOnly: true}
            # The Cedar policy set, mounted rather than copied in. `kubectl cp`
            # is the obvious way and cannot work here: it shells out to tar
            # inside the container, and this image is distroless.
            - {name: policies, mountPath: /etc/cardinal/policies, readOnly: true}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            # Spelled numerically, and it has to be. The distroless base declares
            # `USER nonroot` by name, and kubelet cannot prove a name is not root
            # — it refuses the container with "image has non-numeric user"
            # rather than guessing. 65532 is what distroless's nonroot resolves
            # to.
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: config
          secret: {secretName: cardinal-config}
        - name: policies
          configMap: {name: cardinal-policies}
---
apiVersion: v1
kind: Service
metadata:
  name: cardinal
  namespace: cardinal
spec:
  selector: {app: cardinal}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
# Cardinal itself is never behind the auth middleware, or signing in would
# require being signed in.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cardinal
  namespace: cardinal
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`id.cardinal.test`)
      services:
        - {name: cardinal, port: 8080}
  tls: {}
