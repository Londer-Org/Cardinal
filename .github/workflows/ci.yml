name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cardinal is authentication infrastructure. Every gate here is a hard failure,
# never a warning: a security product whose CI merely suggests is a product
# whose invariants erode one "fix it later" at a time.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What a change can actually affect, so the rest can skip what it cannot.
  #
  # Job-level `if` rather than `paths-ignore` on the workflow: a workflow that
  # does not run reports nothing, and a check that never reports is one branch
  # protection waits for forever. A job that is skipped still reports.
  #
  # The mapping lives in a script so it can be tested, and it is
  # (internal/lint/ci_filter_test.go). It is the one piece of this pipeline
  # whose failure mode is a green tick on something nobody checked.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.scope.outputs.go }}
      frontend: ${{ steps.scope.outputs.frontend }}
      image: ${{ steps.scope.outputs.image }}
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, because the range below reaches back to a base
          # commit a shallow clone would not have.
          fetch-depth: 0

      - name: Work out what changed
        id: scope
        run: |
          set -eu
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="${{ github.event.pull_request.base.sha }}...HEAD"
          elif git rev-parse --verify -q HEAD^ >/dev/null; then
            range="HEAD^ HEAD"
          else
            range=""
          fi

          # Fail towards running everything. Not knowing what changed is a
          # reason to check all of it, never a reason to skip.
          if [ -z "$range" ] || ! git diff --name-only $range > changed.txt; then
            echo "::warning::could not work out what changed — running everything"
            printf 'go=true\nfrontend=true\nimage=true\ne2e=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed:"
          sed 's/^/  /' changed.txt
          echo
          .github/scripts/changed-areas.sh < changed.txt | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build and vet
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned to the patch, in every job, and matching the `go` directive in
      # go.mod. setup-go sets GOTOOLCHAIN=local, so Go may not fetch a
      # toolchain of its own: asking for '1.25' gets whatever the runner has
      # cached, and a go.mod requiring anything newer fails at once with
      # "GOTOOLCHAIN=local". Bumping one without the other is therefore a
      # loud failure rather than a silent old toolchain, which is the way
      # round to want it.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          check-latest: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum \
            || { echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy'"; exit 1; }

      - run: go build ./...
      - run: go vet ./...

      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@latest
          test -z "$(gofumpt -l .)" \
            || { gofumpt -l -d .; echo "::error::run 'gofumpt -w .'"; exit 1; }

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # `any` is banned and the no-unsafe-* rules are errors. A security
      # product whose frontend casts around its own type system is worse than
      # one with no types — it looks safe. See ADR 0008.
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: web

      - name: Lint
        run: npx eslint . --max-warnings 0
        working-directory: web

      - name: Build
        run: npx vite build
        working-directory: web

  image:
    name: Container image builds
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Proves the single-artifact property still holds: UI compiled, embedded,
      # and the whole thing running as a static binary on distroless.
      - name: Build image
        run: docker build -t cardinal:ci .

      # The published image must not carry the administrative CLI.
      #
      # It used to be the entrypoint, and the configuration it reads carries the
      # connection string — so a shell in a running container was an
      # unauthenticated administrator in one command. Asserted here rather than
      # trusted to the Dockerfile, because a COPY added for a good reason is
      # exactly how it would come back.
      - name: The image carries the server and not the CLI
        run: |
          set -eu
          docker run --rm --entrypoint /usr/local/bin/cardinal-server \
            cardinal:ci version
          if docker run --rm --entrypoint /usr/local/bin/cardinal \
               cardinal:ci version 2>/dev/null; then
            echo "::error::the published image contains the administrative CLI"
            exit 1
          fi

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
      # Pinned, like the PostgreSQL image and for the same reason: `latest`
      # means CI and a developer's machine run different linters, and the
      # difference shows up as a red build nobody can reproduce. This project
      # found that on its first CI run — the config had `settings` and
      # `exclusions` at the root, which 2.11 silently ignored and 2.12 rejects,
      # so the rules had never actually applied.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  vulncheck:
    name: Vulnerability scan
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  test:
    name: Tests (PostgreSQL ${{ matrix.postgres }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pinned, never floated: FOR PORTION OF changed between 19 beta 1 and
        # beta 2, so a floating tag would let the suite's meaning drift.
        #
        # Add "19" here the moment it goes GA, keep beta2 until it does, then
        # drop beta2 in the same commit that moves production to GA.
        postgres: ['19beta2']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'

      # Integration tests use testcontainers and start PostgreSQL themselves,
      # so no service container is declared here. The image is pre-pulled to
      # keep the first test's startup out of the suite's timeout budget.
      - name: Pre-pull PostgreSQL image
        run: docker pull postgres:${{ matrix.postgres }}

      # Everything except test/e2e, which needs the example stack running and
      # has a job of its own below. `go test ./...` would include it, and its
      # TestMain exits 1 with "the stack is not running" rather than skipping —
      # deliberately, so somebody running it by hand is told what to do rather
      # than handed a dial timeout.
      # Two commands rather than one, because two packages start a PostgreSQL
      # of their own — internal/store for the temporal invariants, and
      # cmd/cardinal-server for first-run setup, which needs a directory with
      # no administrators in it and so cannot share one. Run together they were
      # both up at once on a two-core runner under -race, and the store suite
      # failed part-way through: every test after a certain point could not
      # connect to a container that had been answering, while the other
      # package's tests had just finished.
      #
      # Which container died, and why, was not established — a runner is gone
      # by the time its log can be read. What is established is that one
      # PostgreSQL at a time does not do this, that it reproduces on neither
      # machine available here, and that splitting these two groups costs a
      # few seconds where `-p 1` across every package costs about thirty.
      - name: Test
        env:
          CARDINAL_TEST_POSTGRES_IMAGE: postgres:${{ matrix.postgres }}
        run: go test ./internal/... ./migrations/... -race -count=1 -timeout 10m

      - name: Test the server commands
        env:
          CARDINAL_TEST_POSTGRES_IMAGE: postgres:${{ matrix.postgres }}
        run: go test ./cmd/... -race -count=1 -timeout 10m

  e2e:
    name: End-to-end
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'

      # The stack is served over HTTPS on a real domain, and both halves of
      # that are load-bearing rather than ceremony: WebAuthn needs a secure
      # context, forwardAuth single sign-on needs a parent-domain cookie, and
      # no plain-http origin provides both. `make e2e-check` refuses to start
      # without these and explains why.
      - name: Trust a local certificate authority
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mkcert libnss3-tools
          mkcert -install

      - name: Resolve the stack's hostnames
        run: make hosts-line | sudo tee -a /etc/hosts

      - name: Start the stack
        run: make e2e-up

      - name: Test
        run: make e2e

      # The stack's own logs, and only when something failed. A red e2e job
      # whose output is "expected 200, got 502" is a job somebody has to
      # reproduce locally to learn anything from.
      - name: Stack logs
        if: failure()
        run: docker compose -f examples/compose.yml logs --tail 200
