name: Docs

# On main only.
#
# It ran on tags too, on the reasoning that a release is when a version snapshot
# becomes worth keeping. That was wrong twice: a snapshot is made by
# `npm run docs:version`, which is a commit on main rather than anything a build
# produces, and the github-pages environment permits deployments only from main
# — so every tag failed at the deploy step having built the site for nothing.
on:
  push:
    branches: [main]
    # Everything the site is built from. The docs live in ../docs rather than
    # inside website/, because they are read in a checkout and on GitHub as
    # often as here — a second copy under website/ would be the one that goes
    # stale.
    paths:
      - 'docs/**'
      - 'website/**'
      - 'VERSION'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'website/**'
  # So the site can be deployed without inventing a commit that touches it —
  # which is what was needed the first time Pages was switched on.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On a pull request this is the whole job: build it, and fail on a broken
  # link. That is not a formality — the first build of this site found two
  # documents pointing at a ROADMAP.md that had never existed, from the "known
  # gaps" section a reader is most likely to follow.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
        working-directory: website

      - run: npm run build
        working-directory: website

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: website/build

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
