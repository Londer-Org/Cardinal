version: "2"

# Cardinal is authentication and authorization infrastructure. The linter
# config leans strict deliberately: the cost of an extra `if err != nil` is
# trivial next to the cost of a silently-swallowed error in an authorization
# path.

linters:
  enable:
    - bodyclose
    - contextcheck      # context must propagate — cancellation matters for tx
    - copyloopvar
    - errorlint         # %w and errors.Is/As used correctly
    - gocritic
    - gosec
    - misspell
    - nilerr            # returning nil after a non-nil error
    - noctx
    - nolintlint        # every //nolint must carry an explanation
    - perfsprint
    - revive
    - rowserrcheck      # sql.Rows.Err() checked — silently truncated results
    - sqlclosecheck
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    gosec:
      excludes:
        # G404 (weak RNG) is not applicable yet; when crypto lands, remove this
        # exclusion rather than adding nolint comments at call sites.
        - G404

    govet:
      enable-all: true
      disable:
        - fieldalignment  # readability wins over struct packing at this scale

    nolintlint:
      require-explanation: true
      require-specific: true

    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]
        - name: context-as-argument
        - name: error-strings
        - name: error-naming
        - name: indent-error-flow

  exclusions:
    # Not a relaxation. `flatted` ships a Go implementation inside its npm
    # package, so `./...` picks up a third-party file that is not part of this
    # module and that nobody here can fix.
    paths:
      - web/node_modules

    rules:
      # Tests deliberately do things production code must not: raw SQL to
      # simulate tampering, disabled rules, fixed credentials.
      - path: _test\.go
        linters: [gosec, unparam, contextcheck]

issues:
  # Report everything. The defaults cap a linter at 50 findings and identical
  # texts at 3, which makes a large cleanup look finished several times over.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
